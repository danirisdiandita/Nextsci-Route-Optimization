$schema: 'https://moonrepo.dev/schemas/project.json'

tasks:
  install:
    script: '../scripts/backend-venv.sh && .venv/bin/pip install -q -r requirements.txt'
    inputs:
      - '.python-version'
      - 'requirements.txt'
    options:
      cache: false
  dev:
    command: '.venv/bin/python manage.py runserver'
    deps:
      - '~:install'
    preset: 'server'
  migrate:
    command: '.venv/bin/python manage.py migrate'
    deps:
      - '~:install'
    options:
      cache: false
      runInCI: false
  createsuperuser:
    command: '.venv/bin/python manage.py createsuperuser'
    deps:
      - '~:migrate'
    options:
      cache: false
      interactive: true
      runInCI: false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextsci · Open-source route planning</title>
    <meta name="description" content="Open-source route planning for delivery and field-service teams. Import orders, optimize routes, and track drivers live." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nextsci" />
    <meta property="og:title" content="Nextsci · Open-source route planning" />
    <meta property="og:description" content="Open-source route planning for delivery and field-service teams. Import orders, optimize routes, and track drivers live." />
    <meta name="twitter:card" content="summary" />
    <!--seo-url-->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090a" />
    <script>
      // Apply a saved light or dark choice before the first paint. Mirrors src/hooks/useTheme.ts.
      try {
        var t = JSON.parse(localStorage.getItem('nextsci.theme')).state.preference
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

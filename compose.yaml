# Local development stack. Copy .env.example to .env to override defaults.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsci}
      POSTGRES_USER: ${POSTGRES_USER:-nextsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsci}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsci}
      POSTGRES_USER: ${POSTGRES_USER:-nextsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsci}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5174:5174"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - backend

  mobile:
    build: ./mobile
    environment:
      # Your computer's LAN IP, so Expo Go on a phone can reach Metro.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:-127.0.0.1}
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    tty: true
    depends_on:
      - backend

volumes:
  pgdata:

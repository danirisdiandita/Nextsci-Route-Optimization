# Local development stack. Copy .env.example to .env to override defaults.
# Start everything: docker compose up --build
# Start only the database: docker compose up -d router-db
services:
  router-db:
    container_name: router-db
    # PostgreSQL 17 with the pgvector extension. db/init enables it on first start.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsci}
      POSTGRES_USER: ${POSTGRES_USER:-nextsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsci}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  router-backend:
    container_name: router-backend
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsci}
      POSTGRES_USER: ${POSTGRES_USER:-nextsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsci}
      POSTGRES_HOST: router-db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-not-for-production-use}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,router-backend}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      router-db:
        condition: service_healthy

  router-dashboard:
    container_name: router-dashboard
    build: ./dashboard
    environment:
      API_PROXY_TARGET: http://router-backend:8000
    ports:
      - "5174:5174"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - router-backend

  router-mobile:
    container_name: router-mobile
    build: ./mobile
    environment:
      # Your computer's LAN IP, so Expo Go on a phone can reach Metro.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:-127.0.0.1}
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    tty: true
    depends_on:
      - router-backend
